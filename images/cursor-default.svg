<svg width="28" height="28" viewBox="0 0 28 28" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Pottery sponge (dry) -->
  <g filter="url(#shadow)">
    <!-- Main sponge body - deep yellow round disc -->
    <ellipse cx="14" cy="14" rx="11" ry="10"
             fill="#f4c430"
             stroke="#1d2b23"
             stroke-width="1.5"/>

    <!-- Sponge pores/texture (scattered holes) -->
    <circle cx="10" cy="11" r="1.2" fill="#d4a520" opacity="0.6"/>
    <circle cx="15" cy="10" r="0.9" fill="#d4a520" opacity="0.5"/>
    <circle cx="18" cy="12" r="1" fill="#d4a520" opacity="0.6"/>
    <circle cx="12" cy="14" r="0.8" fill="#d4a520" opacity="0.5"/>
    <circle cx="17" cy="15" r="1.1" fill="#d4a520" opacity="0.6"/>
    <circle cx="9" cy="16" r="0.9" fill="#d4a520" opacity="0.5"/>
    <circle cx="14" cy="17" r="1" fill="#d4a520" opacity="0.6"/>
    <circle cx="19" cy="17" r="0.8" fill="#d4a520" opacity="0.5"/>
    <circle cx="11" cy="19" r="0.9" fill="#d4a520" opacity="0.6"/>
    <circle cx="16" cy="19" r="1" fill="#d4a520" opacity="0.5"/>

    <!-- Additional small pores -->
    <circle cx="8" cy="13" r="0.6" fill="#d4a520" opacity="0.4"/>
    <circle cx="13" cy="12" r="0.6" fill="#d4a520" opacity="0.4"/>
    <circle cx="20" cy="14" r="0.6" fill="#d4a520" opacity="0.4"/>
    <circle cx="10" cy="17" r="0.6" fill="#d4a520" opacity="0.4"/>
    <circle cx="15" cy="13" r="0.6" fill="#d4a520" opacity="0.4"/>

    <!-- Subtle depth line (bottom edge) -->
    <path d="M5 18 Q14 22, 23 18"
          stroke="#1d2b23"
          stroke-width="1"
          opacity="0.2"
          fill="none"/>
  </g>

  <defs>
    <filter id="shadow">
      <feDropShadow dx="0.5" dy="0.5" stdDeviation="0.8" flood-opacity="0.25"/>
    </filter>
  </defs>
</svg>